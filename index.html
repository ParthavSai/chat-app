<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatConnect - Real-time Messaging</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-enter {
            animation: fadeIn 0.3s ease-out;
        }
        .online-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div id="app"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Simulated real-time backend (using localStorage + polling for demo)
        class ChatService {
            constructor() {
                this.currentUser = null;
                this.messageListeners = [];
                this.userListeners = [];
                this.pollInterval = null;
            }

            async register(username, email, password) {
                const users = this.getUsers();
                if (users.find(u => u.email === email)) {
                    throw new Error('Email already registered');
                }
                const user = {
                    id: Date.now().toString(),
                    username,
                    email,
                    password, // In production, hash this!
                    createdAt: Date.now(),
                    lastSeen: Date.now()
                };
                users.push(user);
                localStorage.setItem('chat_users', JSON.stringify(users));
                return user;
            }

            async login(email, password) {
                const users = this.getUsers();
                const user = users.find(u => u.email === email && u.password === password);
                if (!user) {
                    throw new Error('Invalid credentials');
                }
                user.lastSeen = Date.now();
                this.updateUser(user);
                this.currentUser = user;
                this.startPolling();
                return user;
            }

            logout() {
                if (this.currentUser) {
                    const user = { ...this.currentUser, lastSeen: Date.now() };
                    this.updateUser(user);
                }
                this.currentUser = null;
                this.stopPolling();
            }

            getUsers() {
                return JSON.parse(localStorage.getItem('chat_users') || '[]');
            }

            updateUser(user) {
                const users = this.getUsers();
                const index = users.findIndex(u => u.id === user.id);
                if (index !== -1) {
                    users[index] = user;
                    localStorage.setItem('chat_users', JSON.stringify(users));
                }
            }

            searchUsers(query) {
                const users = this.getUsers();
                return users.filter(u => 
                    u.id !== this.currentUser?.id &&
                    (u.username.toLowerCase().includes(query.toLowerCase()) ||
                     u.email.toLowerCase().includes(query.toLowerCase()))
                );
            }

            async sendMessage(toUserId, content) {
                const messages = this.getMessages();
                const message = {
                    id: Date.now().toString(),
                    fromUserId: this.currentUser.id,
                    toUserId,
                    content,
                    timestamp: Date.now(),
                    read: false
                };
                messages.push(message);
                localStorage.setItem('chat_messages', JSON.stringify(messages));
                this.notifyMessageListeners();
                return message;
            }

            getMessages() {
                return JSON.parse(localStorage.getItem('chat_messages') || '[]');
            }

            getConversation(userId) {
                const messages = this.getMessages();
                return messages.filter(m => 
                    (m.fromUserId === this.currentUser.id && m.toUserId === userId) ||
                    (m.fromUserId === userId && m.toUserId === this.currentUser.id)
                ).sort((a, b) => a.timestamp - b.timestamp);
            }

            getConversations() {
                const messages = this.getMessages();
                const userIds = new Set();
                messages.forEach(m => {
                    if (m.fromUserId === this.currentUser.id) userIds.add(m.toUserId);
                    if (m.toUserId === this.currentUser.id) userIds.add(m.fromUserId);
                });
                
                const users = this.getUsers();
                return Array.from(userIds).map(userId => {
                    const user = users.find(u => u.id === userId);
                    const userMessages = messages.filter(m => 
                        (m.fromUserId === this.currentUser.id && m.toUserId === userId) ||
                        (m.fromUserId === userId && m.toUserId === this.currentUser.id)
                    );
                    const lastMessage = userMessages.sort((a, b) => b.timestamp - a.timestamp)[0];
                    return { user, lastMessage };
                }).filter(c => c.user);
            }

            isUserOnline(user) {
                return Date.now() - user.lastSeen < 30000; // Online if active in last 30 seconds
            }

            startPolling() {
                this.pollInterval = setInterval(() => {
                    if (this.currentUser) {
                        this.currentUser.lastSeen = Date.now();
                        this.updateUser(this.currentUser);
                        this.notifyMessageListeners();
                        this.notifyUserListeners();
                    }
                }, 2000);
            }

            stopPolling() {
                if (this.pollInterval) {
                    clearInterval(this.pollInterval);
                    this.pollInterval = null;
                }
            }

            onMessage(callback) {
                this.messageListeners.push(callback);
                return () => {
                    this.messageListeners = this.messageListeners.filter(cb => cb !== callback);
                };
            }

            onUserUpdate(callback) {
                this.userListeners.push(callback);
                return () => {
                    this.userListeners = this.userListeners.filter(cb => cb !== callback);
                };
            }

            notifyMessageListeners() {
                this.messageListeners.forEach(cb => cb());
            }

            notifyUserListeners() {
                this.userListeners.forEach(cb => cb());
            }
        }

        const chatService = new ChatService();

        function ChatApp() {
            const [currentUser, setCurrentUser] = useState(null);
            const [view, setView] = useState('login'); // 'login', 'register', 'chat'
            const [selectedUser, setSelectedUser] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [conversations, setConversations] = useState([]);
            const [messages, setMessages] = useState([]);
            const [newMessage, setNewMessage] = useState('');
            const [error, setError] = useState('');
            const messagesEndRef = useRef(null);

            useEffect(() => {
                if (currentUser) {
                    const unsubscribe = chatService.onMessage(() => {
                        if (selectedUser) {
                            setMessages(chatService.getConversation(selectedUser.id));
                        }
                        setConversations(chatService.getConversations());
                    });

                    const unsubscribeUsers = chatService.onUserUpdate(() => {
                        setConversations(chatService.getConversations());
                    });

                    return () => {
                        unsubscribe();
                        unsubscribeUsers();
                    };
                }
            }, [currentUser, selectedUser]);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            useEffect(() => {
                if (currentUser) {
                    setConversations(chatService.getConversations());
                }
            }, [currentUser]);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                const formData = new FormData(e.target);
                try {
                    const user = await chatService.login(
                        formData.get('email'),
                        formData.get('password')
                    );
                    setCurrentUser(user);
                    setView('chat');
                } catch (err) {
                    setError(err.message);
                }
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setError('');
                const formData = new FormData(e.target);
                try {
                    const user = await chatService.register(
                        formData.get('username'),
                        formData.get('email'),
                        formData.get('password')
                    );
                    await chatService.login(formData.get('email'), formData.get('password'));
                    setCurrentUser(user);
                    setView('chat');
                } catch (err) {
                    setError(err.message);
                }
            };

            const handleLogout = () => {
                chatService.logout();
                setCurrentUser(null);
                setView('login');
                setSelectedUser(null);
                setMessages([]);
                setConversations([]);
            };

            const handleSearch = (query) => {
                setSearchQuery(query);
                if (query.trim()) {
                    setSearchResults(chatService.searchUsers(query));
                } else {
                    setSearchResults([]);
                }
            };

            const selectUser = (user) => {
                setSelectedUser(user);
                setMessages(chatService.getConversation(user.id));
                setSearchQuery('');
                setSearchResults([]);
            };

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!newMessage.trim() || !selectedUser) return;
                
                await chatService.sendMessage(selectedUser.id, newMessage);
                setNewMessage('');
                setMessages(chatService.getConversation(selectedUser.id));
                setConversations(chatService.getConversations());
            };

            const formatTime = (timestamp) => {
                const date = new Date(timestamp);
                const now = new Date();
                const diff = now - date;
                
                if (diff < 60000) return 'Just now';
                if (diff < 3600000) return `${Math.floor(diff / 60000)}m ago`;
                if (diff < 86400000) return date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            if (view === 'login') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                            <h1 className="text-3xl font-bold text-center text-indigo-600 mb-6">ChatConnect</h1>
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input
                                        type="email"
                                        name="email"
                                        required
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="your@email.com"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input
                                        type="password"
                                        name="password"
                                        required
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="••••••••"
                                    />
                                </div>
                                {error && <p className="text-red-500 text-sm">{error}</p>}
                                <button
                                    type="submit"
                                    className="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition"
                                >
                                    Login
                                </button>
                            </form>
                            <p className="text-center mt-4 text-sm text-gray-600">
                                Don't have an account?{' '}
                                <button onClick={() => setView('register')} className="text-indigo-600 hover:underline font-medium">
                                    Register
                                </button>
                            </p>
                        </div>
                    </div>
                );
            }

            if (view === 'register') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                            <h1 className="text-3xl font-bold text-center text-indigo-600 mb-6">Create Account</h1>
                            <form onSubmit={handleRegister} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Username</label>
                                    <input
                                        type="text"
                                        name="username"
                                        required
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="johndoe"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
                                    <input
                                        type="email"
                                        name="email"
                                        required
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="your@email.com"
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input
                                        type="password"
                                        name="password"
                                        required
                                        minLength="6"
                                        className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        placeholder="••••••••"
                                    />
                                </div>
                                {error && <p className="text-red-500 text-sm">{error}</p>}
                                <button
                                    type="submit"
                                    className="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition"
                                >
                                    Register
                                </button>
                            </form>
                            <p className="text-center mt-4 text-sm text-gray-600">
                                Already have an account?{' '}
                                <button onClick={() => setView('login')} className="text-indigo-600 hover:underline font-medium">
                                    Login
                                </button>
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen">
                    {/* Sidebar */}
                    <div className="w-80 bg-white border-r border-gray-200 flex flex-col">
                        <div className="p-4 border-b border-gray-200">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="text-xl font-bold text-indigo-600">ChatConnect</h2>
                                <button
                                    onClick={handleLogout}
                                    className="text-sm text-gray-600 hover:text-red-600"
                                >
                                    Logout
                                </button>
                            </div>
                            <div className="flex items-center space-x-2 mb-4">
                                <div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
                                    {currentUser.username[0].toUpperCase()}
                                </div>
                                <div>
                                    <p className="font-medium">{currentUser.username}</p>
                                    <p className="text-xs text-green-600">● Online</p>
                                </div>
                            </div>
                            <input
                                type="text"
                                placeholder="Search users..."
                                value={searchQuery}
                                onChange={(e) => handleSearch(e.target.value)}
                                className="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            />
                        </div>

                        <div className="flex-1 overflow-y-auto">
                            {searchQuery ? (
                                <div className="p-2">
                                    <p className="text-xs text-gray-500 px-2 mb-2">Search Results</p>
                                    {searchResults.map(user => (
                                        <button
                                            key={user.id}
                                            onClick={() => selectUser(user)}
                                            className="w-full p-3 hover:bg-gray-100 rounded-lg flex items-center space-x-3"
                                        >
                                            <div className="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-white font-bold">
                                                {user.username[0].toUpperCase()}
                                            </div>
                                            <div className="flex-1 text-left">
                                                <p className="font-medium">{user.username}</p>
                                                <p className="text-xs text-gray-500">{user.email}</p>
                                            </div>
                                            {chatService.isUserOnline(user) && (
                                                <div className="w-2 h-2 bg-green-500 rounded-full online-pulse"></div>
                                            )}
                                        </button>
                                    ))}
                                    {searchResults.length === 0 && (
                                        <p className="text-center text-gray-500 text-sm py-4">No users found</p>
                                    )}
                                </div>
                            ) : (
                                <div className="p-2">
                                    <p className="text-xs text-gray-500 px-2 mb-2">Conversations</p>
                                    {conversations.map(({ user, lastMessage }) => (
                                        <button
                                            key={user.id}
                                            onClick={() => selectUser(user)}
                                            className={`w-full p-3 rounded-lg flex items-center space-x-3 ${
                                                selectedUser?.id === user.id ? 'bg-indigo-50' : 'hover:bg-gray-100'
                                            }`}
                                        >
                                            <div className="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-white font-bold">
                                                {user.username[0].toUpperCase()}
                                            </div>
                                            <div className="flex-1 text-left min-w-0">
                                                <p className="font-medium truncate">{user.username}</p>
                                                <p className="text-sm text-gray-500 truncate">
                                                    {lastMessage?.content || 'No messages yet'}
                                                </p>
                                            </div>
                                            <div className="text-xs text-gray-400">
                                                {lastMessage && formatTime(lastMessage.timestamp)}
                                            </div>
                                        </button>
                                    ))}
                                    {conversations.length === 0 && (
                                        <p className="text-center text-gray-500 text-sm py-4">
                                            Search for users to start chatting
                                        </p>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {/* Chat Area */}
                    <div className="flex-1 flex flex-col bg-gray-50">
                        {selectedUser ? (
                            <>
                                <div className="bg-white border-b border-gray-200 p-4 flex items-center space-x-3">
                                    <div className="w-10 h-10 bg-gray-300 rounded-full flex items-center justify-center text-white font-bold">
                                        {selectedUser.username[0].toUpperCase()}
                                    </div>
                                    <div>
                                        <p className="font-medium">{selectedUser.username}</p>
                                        <p className="text-xs text-gray-500">
                                            {chatService.isUserOnline(selectedUser) ? (
                                                <span className="text-green-600">● Online</span>
                                            ) : (
                                                `Last seen ${formatTime(selectedUser.lastSeen)}`
                                            )}
                                        </p>
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                                    {messages.map(msg => (
                                        <div
                                            key={msg.id}
                                            className={`flex message-enter ${
                                                msg.fromUserId === currentUser.id ? 'justify-end' : 'justify-start'
                                            }`}
                                        >
                                            <div
                                                className={`max-w-xs lg:max-w-md px-4 py-2 rounded-2xl ${
                                                    msg.fromUserId === currentUser.id
                                                        ? 'bg-indigo-600 text-white'
                                                        : 'bg-white text-gray-800 border border-gray-200'
                                                }`}
                                            >
                                                <p>{msg.content}</p>
                                                <p className={`text-xs mt-1 ${
                                                    msg.fromUserId === currentUser.id ? 'text-indigo-200' : 'text-gray-400'
                                                }`}>
                                                    {formatTime(msg.timestamp)}
                                                </p>
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>

                                <form onSubmit={sendMessage} className="bg-white border-t border-gray-200 p-4">
                                    <div className="flex space-x-2">
                                        <input
                                            type="text"
                                            value={newMessage}
                                            onChange={(e) => setNewMessage(e.target.value)}
                                            placeholder="Type a message..."
                                            className="flex-1 px-4 py-2 border border-gray-300 rounded-full focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                        />
                                        <button
                                            type="submit"
                                            className="bg-indigo-600 text-white px-6 py-2 rounded-full font-medium hover:bg-indigo-700 transition"
                                        >
                                            Send
                                        </button>
                                    </div>
                                </form>
                            </>
                        ) : (
                            <div className="flex-1 flex items-center justify-center text-gray-400">
                                <div className="text-center">
                                    <svg className="w-20 h-20 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                                    </svg>
                                    <p className="text-xl">Select a conversation to start chatting</p>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<ChatApp />);
    </script>
</body>
</html>
